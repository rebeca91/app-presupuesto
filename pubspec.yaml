name: app_presupuesto
description: Aplicación de presupuesto personal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter_local_notifications: ^21.0.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Logo.png
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/Logo.png
